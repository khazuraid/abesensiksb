# File ini hanya untuk self-hosted (docker compose up).
# Saat deploy via Coolify, file ini TIDAK dipakai — Coolify pakai apps/api/Dockerfile
# dan managed Postgres/Redis resource. Lihat DEPLOYMENT.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-adms}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-adms_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # PENTING: jangan expose port 5432 ke host kalau VPS punya IP publik.
    # Postgres hanya boleh diakses dari Docker network internal.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-adms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sama: jangan expose port 6379 ke publik.

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${DB_USER:-adms}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-adms_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${WEB_URL:-http://localhost:3000}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ADMS_SECRET_KEY: ${ADMS_SECRET_KEY:-}
      PORT: 8888
    ports:
      - "8888:8888"

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8888/api}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
