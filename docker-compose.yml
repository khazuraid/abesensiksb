services:
  postgres:
    image: postgres:16-alpine
    container_name: adms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adms
      POSTGRES_PASSWORD: adms123
      POSTGRES_DB: adms_db
    ports:
      - "5432:5432"
    volumes:
      - adms_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: adms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: adms_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - adms_minio_data:/data

volumes:
  adms_postgres_data:
  adms_minio_data:
