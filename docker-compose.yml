services:
  postgres:
    image: postgres:16-alpine
    container_name: adms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adms
      POSTGRES_PASSWORD: adms123
      POSTGRES_DB: adms_db
    ports:
      - "5432:5432"
    volumes:
      - adms_postgres_data:/var/lib/postgresql/data

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: adms_pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://adms:adms123@postgres:5432/adms_db
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 100
      POOL_MODE: transaction
    ports:
      - "6432:5432"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: adms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: adms_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - adms_minio_data:/data

volumes:
  adms_postgres_data:
  adms_minio_data:
