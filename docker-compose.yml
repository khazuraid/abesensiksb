services:
  absensi:
    container_name: adms
    build:
      context: .
      target: all-in-one
      args:
        NEXT_PUBLIC_WORKER_URL: ${WORKER_PUBLIC_URL:-}
    image: absensi:latest
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER:-adms}
      DB_PASSWORD: ${DB_PASSWORD:-adms123}
      DB_NAME: ${DB_NAME:-adms_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:8080}
      CORS_ORIGIN: ${WEB_PUBLIC_URL:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL wajib diisi}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD wajib diisi}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NODE_ENV: production
      TZ: Asia/Jakarta
    ports:
      - "8080:8080"
      - "8888:8888"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - redis_data:/var/lib/redis
      - uploads:/app/apps/web/uploads
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${DB_USER:-adms} -d $${DB_NAME:-adms_db} && redis-cli -h 127.0.0.1 ping | grep -q PONG && wget -q -O - http://127.0.0.1:8080/api/health-db >/dev/null && wget -q -O - http://127.0.0.1:8888/health/ready >/dev/null"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 45s

volumes:
  postgres_data:
    name: adms_postgres_data
  redis_data:
    name: adms_redis_data
  uploads:
    name: adms_uploads
