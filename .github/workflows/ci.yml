name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adms
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: adms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adms -d adms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://adms:ci_password@127.0.0.1:5432/adms_ci
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci_jwt_secret_at_least_32_characters
      ADMS_SECRET_KEY: ci_adms_secret_at_least_32_characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/database/migrate.js
      - run: node packages/database/migrate.js
      - run: pnpm run verify
      - name: Verify migration journal and runtime infrastructure
        run: |
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from migration_history")" = "6"
          test "$(psql "$DATABASE_URL" -Atc "select to_regclass('public.worker_cron_runs') is not null")" = "t"
          node -e 'const net=require("node:net"); const socket=net.createConnection({host:process.env.REDIS_HOST,port:Number(process.env.REDIS_PORT)},()=>socket.write("*1\r\n$4\r\nPING\r\n")); socket.setTimeout(2000); socket.on("data",data=>{if(data.toString().trim()!=="+PONG") process.exit(1); socket.end()}); socket.on("timeout",()=>process.exit(1)); socket.on("error",()=>process.exit(1))'
